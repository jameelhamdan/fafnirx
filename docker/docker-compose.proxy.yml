# Puts Caddy in front of fafnirx and closes the master's own ports. Use it on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml in .env and use `docker compose` as usual.
#
# Then nothing but the proxy is reachable from outside: the web app is on port 80 (and 443 with a domain, see the
# Caddyfile) and devices connect to port 7443 as before. The master is told to believe the client address that Caddy
# passes on (FAFNIRX_TRUSTED_PROXY), which is why failed logins are counted per person and not per proxy.
#
#   .env:  FAFNIRX_WEB_ADDRESS=fafnirx.example.com            # https with a certificate Caddy gets itself
#          FAFNIRX_DEVICE_ADDRESS=fafnirx.example.com:7443    # devices over https
#          FAFNIRX_HTTP_PORT, FAFNIRX_HTTPS_PORT, FAFNIRX_DEVICE_PORT   # other ports on the host, if these are taken

services:
  master:
    # The base file publishes these; here they are only reachable inside the network.
    ports: !reset []
    expose: ["8080", "7443"]
    environment:
      # Everything that can reach the master is a container of this network, and the only one that forwards clients is
      # the proxy: its word about the client is believed. (Change with the network: FAFNIRX_SUBNET.)
      FAFNIRX_TRUSTED_PROXY: "${FAFNIRX_SUBNET:-172.30.0.0/24}"

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    environment:
      FAFNIRX_WEB_ADDRESS: "${FAFNIRX_WEB_ADDRESS:-:80}"
      FAFNIRX_DEVICE_ADDRESS: "${FAFNIRX_DEVICE_ADDRESS:-:7443}"
    ports:
      - "${FAFNIRX_HTTP_PORT:-80}:80"
      - "${FAFNIRX_HTTPS_PORT:-443}:443"
      - "${FAFNIRX_DEVICE_PORT:-7443}:7443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates Caddy gets: keep them, or it asks again at every start.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: "${FAFNIRX_SUBNET:-172.30.0.0/24}"
