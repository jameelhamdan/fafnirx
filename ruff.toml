line-length = 120

[lint]
select = ["E", "F", "W", "B", "C4", "SIM", "UP"]
ignore = [
    "B008",   # FastAPI declares dependencies as default arguments
    "E501",   # long lines are left to the formatter
]

[lint.per-file-ignores]
"tests/*" = ["E731"]   # tiny throw-away lambdas in the end-to-end scripts
