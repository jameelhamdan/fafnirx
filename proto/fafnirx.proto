syntax = "proto3";

package fafnirx.v1;

// Device API. Auth: `authorization: Bearer <token>` metadata.
// Additive: no call reads, lists or removes what is stored for the caller's device (MarkDeleted only marks; data stays until
// retention). Reads: update downloads, and shared folders of the caller's user (ListShared, ListChanges, DownloadShared,
// WatchShared). Negotiate, UploadChunks, Commit and MarkDeleted act on a shared folder when `x-fafnirx-shared:
// <owner>/<name>` is set (bare `<name>` = the user's own).
service Collector {
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Which master this is. A client remembers what it sent to a master; when the answer changes (a new
  // database, another master at the same address) that memory no longer applies and it starts over.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);

  // Answers with the chunks the master still needs: those an interrupted upload has not
  // delivered, or none when it already has the content (the current version of the path, or
  // another file of the device).
  rpc Negotiate(Manifest) returns (NegotiateResponse);

  // Client-streaming upload of chunks. Every chunk is verified against its hash and written at its
  // place in the file being assembled; the whole file is verified again by Commit.
  rpc UploadChunks(stream Chunk) returns (UploadSummary);

  // Records a new version of a path and stores the file under its own name. The upload must be complete.
  rpc Commit(CommitRequest) returns (CommitResponse);

  // Marks a path deleted on the device. Nothing is removed from the master.
  rpc MarkDeleted(DeleteRequest) returns (DeleteResponse);

  // Client binary updates, hosted by the master and signed off-box.
  rpc GetUpdateInfo(UpdateInfoRequest) returns (UpdateInfo);
  rpc DownloadUpdate(UpdateInfoRequest) returns (stream UpdateChunk);

  // The shared folders of the user of the calling device.
  rpc ListShared(ListSharedRequest) returns (ListSharedResponse);

  // Makes a shared folder for the user of the calling device. Succeeds when it exists already.
  rpc CreateShared(CreateSharedRequest) returns (CreateSharedResponse);

  // The paths of a shared folder written or deleted since `since`, as they are now: the cursor first, then the paths.
  rpc ListChanges(ListChangesRequest) returns (stream ChangeEvent);

  // The current content of a file of a shared folder.
  rpc DownloadShared(DownloadSharedRequest) returns (stream FileData);

  // Says when one of the named shared folders changed, so that a computer need not poll: once for each folder when the call
  // starts (look now), then whenever a file in it was written or deleted. Folders the caller cannot use are left out.
  rpc WatchShared(WatchSharedRequest) returns (stream SharedChanged);
}

message HeartbeatRequest {
  string hostname = 1;
  string os = 2;            // "windows" | "macos" | "linux"
  string client_version = 3;
  uint64 disk_total = 4;    // bytes, volume holding the collected folders
  uint64 disk_free = 5;
  repeated string errors = 6;  // recent upload errors, drained on every beat
  // What the client is doing right now. phase is empty or "idle" when nothing is going on.
  string phase = 7;            // scanning | hashing | uploading
  string current_file = 8;     // remote path of the file being worked on
  uint32 files_done = 9;
  uint32 files_total = 10;
  uint64 bytes_done = 11;      // of bytes_total, this cycle
  uint64 bytes_total = 12;
  uint64 speed_bps = 13;       // upload speed, bytes per second
  repeated SharedState shared = 14;  // the shared folders attached here, all of them on every beat
}

// What one shared folder attached to a computer is doing.
message SharedState {
  string name = 1;             // <owner>/<name>
  uint64 files = 2;            // in step with the master
  uint64 bytes = 3;
  int64 last_cycle = 4;        // unix seconds, 0 before the first cycle
  string last_error = 5;       // empty when the last cycle went well
  uint32 held = 6;             // deletions held back
  uint32 failing = 7;          // files waiting for a retry
}

message IdentifyRequest {}

message IdentifyResponse {
  string master_id = 1;     // random, made once per database
}

message HeartbeatResponse {
  string device_name = 1;
  int64 server_time = 2;    // unix seconds
}

// A file is described by its ordered chunk hashes. Chunks are fixed 4 MiB
// (the last one may be shorter). root_hash = blake3(chunk_hash_0 || ... || chunk_hash_n || size_le64).
message Manifest {
  string path = 1;          // relative, '/' separated, NFC normalized
  uint64 size = 2;
  bytes root_hash = 3;
  repeated bytes chunk_hashes = 4;
}

message NegotiateResponse {
  repeated uint32 missing = 1;  // indexes into Manifest.chunk_hashes
  bool already_current = 2;     // the stored current version already has this root hash
}

message Chunk {
  bytes hash = 1;
  bytes data = 2;
  bytes root_hash = 3;          // of the file this chunk belongs to
  uint32 index = 4;             // position in Manifest.chunk_hashes
}

message UploadSummary {
  uint32 stored = 1;
}

message CommitRequest {
  Manifest manifest = 1;
  int64 mtime = 2;              // unix nanoseconds
  uint32 mode = 3;              // best effort, 0 when unknown
  string renamed_from = 4;      // set when this commit is a rename
}

message CommitResponse {
  uint64 version_id = 1;
}

message DeleteRequest {
  string path = 1;
}

message DeleteResponse {}

message UpdateInfoRequest {
  string platform = 1;          // e.g. "windows-x86_64"
}

message UpdateInfo {
  bool available = 1;
  string version = 2;
  bytes sha256 = 3;
  bytes signature = 4;          // ed25519 over "fafnirx-update\n<platform>\n<version>\n<sha256 hex>"
  uint64 size = 5;
}

message UpdateChunk {
  bytes data = 1;
}

message ListSharedRequest {}

message ListSharedResponse {
  repeated string names = 1;    // every shared folder the user can use, as <owner>/<name>
  repeated string mine = 2;     // those of the names that are the user's own
}

message CreateSharedRequest {
  string name = 1;              // a device-style name: lowercase letters, digits, '.', '_' and '-'
}

message CreateSharedResponse {}

message ListChangesRequest {
  string shared = 1;
  int64 since = 2;              // a cursor from an earlier answer; 0 lists every path
}

message ChangeEvent {
  oneof item {
    int64 cursor = 1;           // sent first: pass it as `since` next time
    Change change = 2;
    // Sent second, when the paths that follow are every live path of the folder, not only what changed since `since`: the
    // master no longer remembers all deletions since then (it was asked from the start, or the caller was away longer than
    // deleted files are kept). A path the caller has and that is not listed was deleted.
    bool complete = 3;
  }
}

message Change {
  string path = 1;
  bool deleted = 2;             // the other fields are set only when it is not
  bytes root_hash = 3;
  uint64 size = 4;
  int64 mtime = 5;              // unix nanoseconds
  uint32 mode = 6;
  bool from_web = 7;            // a deletion made in the web app: deliberate, and in the Trash to restore, so it is not held
}

message DownloadSharedRequest {
  string shared = 1;
  string path = 2;
}

message FileData {
  bytes data = 1;
}

message WatchSharedRequest {
  repeated string shared = 1;   // as in `x-fafnirx-shared`
}

message SharedChanged {
  string shared = 1;            // as the caller named it
}
