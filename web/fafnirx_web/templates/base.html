<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}fafnirx{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/ui.css">
  <script>
    try { if (localStorage.getItem("fx-theme") === "light") document.documentElement.classList.remove("dark"); } catch (e) {}
  </script>
  <script src="/static/app.js"></script>
  <script defer src="/static/alpine.min.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 3h8l5 5v13H6zM14 3v5h5"/></symbol>
  </svg>

  <header class="top" x-data="{ open: false }">
    <div class="container">
      <a class="brand" href="/">fafnirx</a>
      {% if admin %}
      <button class="ghost menu" type="button" @click="open = !open" :aria-expanded="open" aria-controls="main-nav">Menu</button>
      <nav id="main-nav" aria-label="Main" :class="{ open: open }">
        <a href="/"{% if nav == 'dashboard' %} aria-current="page"{% endif %}>Dashboard</a>
        <a href="/devices"{% if nav == 'devices' %} aria-current="page"{% endif %}>Devices</a>
        <a href="/sources"{% if nav == 'sources' %} aria-current="page"{% endif %}>Sources</a>
        <a href="/mirrors"{% if nav == 'mirrors' %} aria-current="page"{% endif %}>Mirrors</a>
        <a href="/settings"{% if nav == 'settings' %} aria-current="page"{% endif %}>Settings</a>
        <a href="/ca.pem">CA certificate</a>
      </nav>
      <div class="tools" x-data="theme">
        <button class="ghost" type="button" @click="toggle()" :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'" x-text="dark ? 'Light' : 'Dark'">Light</button>
        <a class="link" href="/logout">Log out</a>
      </div>
      {% endif %}
    </div>
  </header>

  <div class="toasts" role="status" aria-live="polite">
    {% for f in flashes %}
    <div class="toast {{ f.kind }}" x-data="{ show: true }" x-init="setTimeout(() => show = false, 7000)" x-show="show" x-transition.opacity>
      <span>{{ f.text }}</span>
      <button class="ghost" type="button" aria-label="Dismiss message" @click="show = false">&times;</button>
    </div>
    {% endfor %}
  </div>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Are you sure?</h2>
      <p id="confirm-text" class="muted"></p>
      <div class="row end">
        <button value="cancel">Cancel</button>
        <button class="danger" id="confirm-ok" value="ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
