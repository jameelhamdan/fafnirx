{% extends "base.html" %}
{% block title %}Log in - fafnirx{% endblock %}
{% block content %}
<div class="login card">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <div>
      <label for="pw">Admin password</label>
      <input id="pw" class="full" type="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <button class="primary" type="submit">Log in</button>
  </form>
</div>
{% endblock %}
