# The typed queries: made by build.rs, with Cornucopia, from queries/*.sql and the migrations, and not stored in the
# repository (see build.rs and docs/development.md).
[package]
name = "fafnirx-db"
version.workspace = true
edition = "2024"
rust-version = "1.85"
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
postgres = "0.19.13"
postgres-protocol = "0.6.11"
postgres-types = { version = "0.2.13", features = ["derive"] }

[build-dependencies]
cornucopia = "1.0.1"

[features]
# Used by the generated code.
wasm-sync = []

[lints.rust]
# Generated code defines helpers that this crate does not happen to use.
dead_code = "allow"
unused_imports = "allow"
