[package]
name = "fafnirx-module-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The plumbing every module that reads sources (see docs/plugins.md) needs and none should write again: the settings from the
# environment, how it makes itself known to the master, the HTTP service for the contract (token guard, manifest, status, the files of the web part, the three fetch
# requests), the list of what is being done, a scratch folder, and small tools: running a program, reading settings, feeds, names, HTTP. A module implements `Fetcher` and calls `serve`.
# It depends on the contract crates and fafnirx-common only, like the modules that use it.
[dependencies]
anyhow.workspace = true
axum = "0.8"
fafnirx-common = { path = "../common", features = ["server"] }
fafnirx-fetch-api = { path = "../fetch-api" }
fafnirx-module-api = { path = "../module-api" }
futures-util = "0.3"
http-body-util = { version = "0.1", optional = true }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tokio.workspace = true
tower = { version = "0.5", features = ["util"], optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `testing`: a module's router, a request to it, a small website and a stand-in program, for the tests of a module.
testing = ["dep:http-body-util", "dep:tower", "dep:tempfile"]

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
