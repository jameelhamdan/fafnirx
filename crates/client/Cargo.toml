[package]
name = "fafnirx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Debian package, built by .github/workflows/release.yml with `cargo deb -p fafnirx --no-build`.
[package.metadata.deb]
maintainer = "Jameel Hamdan <jameelhamdan@users.noreply.github.com>"
extended-description = "Backs up folders to your own fafnirx master. After installing, run `sudo fafnirx install --server <address>` (it asks for the token): that enrolls this computer and installs and starts the fafnirx service."
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "libayatana-appindicator3-1"
assets = [["../../target/client/fafnirx", "usr/bin/", "755"]]
maintainer-scripts = "../../installer/deb"

[features]
default = ["tray"]
# The tray icon needs GTK/appindicator development packages on Linux; build with --no-default-features to skip it.
tray = ["dep:tray-icon", "dep:tao", "dep:rfd", "dep:resvg"]

[dependencies]
fafnirx-common = { path = "../common" }
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "6"
open = "5"
rpassword = "7"
rusqlite.workspace = true
self-replace = "1"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
gethostname = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-stream.workspace = true
toml_edit = { version = "0.22", features = ["serde"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
unicode-normalization.workspace = true
tao = { version = "0.30", optional = true }
# common-controls-v6: on Windows, dialogs with their own button texts (needs the manifest made by build.rs)
rfd = { version = "0.15", features = ["common-controls-v6"], optional = true }
tray-icon = { version = "0.19", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

# The Windows service: runs under the Service Control Manager, and is started, stopped and removed through it.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
