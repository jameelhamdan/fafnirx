[package]
name = "fafnirx"
version.workspace = true
edition.workspace = true

[features]
default = ["tray"]
# The tray icon needs GTK/appindicator development packages on Linux; build with --no-default-features to skip it.
tray = ["dep:tray-icon", "dep:tao", "dep:rfd", "dep:resvg"]

[dependencies]
fafnirx-common = { path = "../common" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
ignore = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify = "6"
rusqlite.workspace = true
self-replace = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml = "0.8"
toml_edit = "0.22"
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
tao = { version = "0.30", optional = true }
rfd = { version = "0.15", optional = true }
tray-icon = { version = "0.19", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
