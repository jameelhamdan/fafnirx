services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fafnirx
      POSTGRES_PASSWORD: "${FAFNIRX_DB_PASSWORD:?set FAFNIRX_DB_PASSWORD}"
      POSTGRES_DB: fafnirx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fafnirx -d fafnirx"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # Keep this on local storage (for example the ZFS pool), not on a network share.
      - "${FAFNIRX_DB_DIR:-./pgdata}:/var/lib/postgresql/data"

  master:
    build: .
    restart: unless-stopped
    user: "${FAFNIRX_UID:-1000}:${FAFNIRX_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      FAFNIRX_DATABASE_URL: "postgresql://fafnirx:${FAFNIRX_DB_PASSWORD}@db/fafnirx"
      FAFNIRX_ADMIN_PASSWORD: "${FAFNIRX_ADMIN_PASSWORD:?set FAFNIRX_ADMIN_PASSWORD}"
      HOME: /tmp # rclone wants a writable home for its cache
    ports:
      - "7443:7443" # devices (gRPC)
      - "8080:8080" # web app and admin API
    volumes:
      # files/<device>/ is the live tree; it can be shared over SMB or NFS as a network drive.
      - "${FAFNIRX_DATA_DIR:-./data}:/data"
      # fafnirx.json (settings, devices, mirrors, sources) and, if you use rclone remotes, rclone.conf. The master reads
      # fafnirx.json at start (restart it after editing; a bad file stops it) and writes it when you change things in the
      # web app. The folder must exist and be writable by FAFNIRX_UID, or Docker creates it for root and the master cannot
      # write to it. See docs/configuration.md.
      - "${FAFNIRX_CONFIG_DIR:-./config}:/config"
