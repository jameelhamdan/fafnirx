services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: fafnirx
      POSTGRES_PASSWORD: "${FAFNIRX_DB_PASSWORD:?set FAFNIRX_DB_PASSWORD}"
      POSTGRES_DB: fafnirx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fafnirx -d fafnirx"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      # Keep this on local storage (for example the ZFS pool), not on a network share.
      - "${FAFNIRX_DB_DIR:-./pgdata}:/var/lib/postgresql/data"

  master:
    # The release on Docker Hub. Pin a version in .env (FAFNIRX_IMAGE=jameelh99/fafnirx:3.0.1) to upgrade on purpose.
    # To build from a checkout instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: "${FAFNIRX_IMAGE:-jameelh99/fafnirx:latest}"
    restart: unless-stopped
    user: "${FAFNIRX_UID:-1000}:${FAFNIRX_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      FAFNIRX_DATABASE_URL: "postgresql://fafnirx:${FAFNIRX_DB_PASSWORD}@db/fafnirx"
      # The password of the user "admin", set at the first start. Change it in the web app afterwards.
      FAFNIRX_ADMIN_PASSWORD: "${FAFNIRX_ADMIN_PASSWORD:?set FAFNIRX_ADMIN_PASSWORD}"
      HOME: /tmp # rclone wants a writable home for its cache
      # A module run as a container (optional): see the `video` service below and docs/video.md. Any module is
      # FAFNIRX_MODULE_<ID>_URL and _TOKEN (docs/modules.md). Without them a module can be installed as a plugin from the
      # web app (Plugins), which needs no setting here.
      FAFNIRX_MODULE_VIDEO_URL: "${FAFNIRX_MODULE_VIDEO_URL:-}"
      FAFNIRX_MODULE_VIDEO_TOKEN: "${FAFNIRX_MODULE_VIDEO_TOKEN:-}"
    ports:
      - "7443:7443" # devices (gRPC)
      - "8080:8080" # web app and web API
    volumes:
      # files/ is the live tree: files/users/<user>/<device>/ for every user, and the master files (which belong to nobody)
      # straight in files/. It can be shared over SMB or NFS as a network drive.
      - "${FAFNIRX_DATA_DIR:-./data}:/data"
      # rclone.conf, if you use rclone remotes for mirrors (the master writes to it when rclone refreshes a token, so it
      # must be writable by FAFNIRX_UID). See docs/usage.md (Mirrors).
      - "${FAFNIRX_CONFIG_DIR:-./config}:/config"

  # The video module as a container of its own: video playback in the web app (HLS made with ffmpeg as a video is watched),
  # subtitles, and the details and poster frames of videos. Off unless asked for (or install the plugin from the web app):
  #   .env:  FAFNIRX_MODULE_VIDEO_URL=http://video:8090   FAFNIRX_MODULE_VIDEO_TOKEN=<openssl rand -hex 24>
  #   then:  mkdir video-cache && docker compose --profile video up -d
  # It has no login of its own and publishes no port: only the master talks to it, behind its login.
  video:
    image: "${FAFNIRX_VIDEO_IMAGE:-jameelh99/fafnirx-video:latest}"
    profiles: ["video"]
    restart: unless-stopped
    user: "${FAFNIRX_UID:-1000}:${FAFNIRX_GID:-1000}"
    environment:
      FAFNIRX_MODULE_TOKEN: "${FAFNIRX_MODULE_VIDEO_TOKEN:-}"
      FAFNIRX_VIDEO_JOBS: "${FAFNIRX_VIDEO_JOBS:-2}"
      FAFNIRX_VIDEO_VCODEC: "${FAFNIRX_VIDEO_VCODEC:-libx264}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      # The videos are read from files/ and never changed.
      - "${FAFNIRX_DATA_DIR:-./data}:/data:ro"
      # Segments made so far; removed after a week without being watched. Must be writable by FAFNIRX_UID.
      - "${FAFNIRX_VIDEO_CACHE_DIR:-./video-cache}:/cache"
