[workspace]
resolver = "2"
members = ["crates/common", "crates/db", "crates/master", "crates/client", "crates/sign", "crates/stream"]

[workspace.package]
version = "3.0.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/jameelhamdan/fafnirx"
homepage = "https://github.com/jameelhamdan/fafnirx"
authors = ["Jameel Hamdan"]

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
hex = "0.4"
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true

# The client shipped to devices: small matters more than fast (it mostly waits for the disk and the network), and
# panic = "abort" is fine because it is a plain process. The master keeps the `release` profile.
# Build it with `--profile client`; the binary is in target/client/.
[profile.client]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
