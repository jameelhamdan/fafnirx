# For development: builds the images from this checkout instead of pulling the release.
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  master:
    image: fafnirx:local
    build:
      context: .
      target: master
  video:
    image: fafnirx-video:local
    build:
      context: .
      target: video
