# Builds the master image (see Dockerfile) for amd64 and arm64 and pushes it to Docker Hub. Off for now: it only runs by
# hand (Actions -> Docker -> Run workflow), and only pushes when "push" is ticked.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write rights), and optionally the
# repository variable DOCKERHUB_IMAGE (default <username>/fafnirx-master).
#
# To turn it on for every version tag, add under `on:`
#   push:
#     tags: ["v*"]
# and replace `inputs.push` below with `(inputs.push || github.event_name == 'push')`.
name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to Docker Hub (otherwise only build it)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: n
        run: |
          echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          echo "image=${{ vars.DOCKERHUB_IMAGE || format('{0}/fafnirx-master', secrets.DOCKERHUB_USERNAME) }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: |
            ${{ steps.n.outputs.image }}:${{ steps.n.outputs.version }}
            ${{ steps.n.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
