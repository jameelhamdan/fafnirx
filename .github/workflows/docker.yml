# The images (see Dockerfile: the master, and one per module) for linux/amd64 and linux/arm64. Called twice by the Release
# workflow:
#   push: false  builds each image on each platform on a runner of its own kind (no emulation), starts it and checks that
#                it works (.github/scripts/smoke-image.sh). Nothing leaves the runner.
#   push: true   builds both platforms again, from the layers the check cached, and pushes <version>, <major>.<minor> and
#                latest to Docker Hub.
# So every image is proven on both platforms before anything is pushed anywhere. A new module is one more entry in the two
# matrices.
#
# The check also makes the plugin bundles (the modules as zip files for the master to install, see docs/modules.md), starts the
# master image with each, and keeps them as artifacts (plugin-<module>-<arch>) for the Release workflow to attach to the release.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write rights), and optionally the
# repository variables DOCKERHUB_IMAGE (default <username>/fafnirx) and DOCKERHUB_VIDEO_IMAGE (default
# <username>/fafnirx-video).
name: Docker

on:
  workflow_call:
    inputs:
      version:
        description: The version being released, X.Y.Z
        type: string
        required: true
      push:
        description: Push to Docker Hub (otherwise only build and check)
        type: boolean
        default: false
      ref:
        description: The commit to build (the Release workflow passes the commit it is releasing); default is the one that started the run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.push }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: master, arch: amd64, os: ubuntu-latest }
          - { image: master, arch: arm64, os: ubuntu-24.04-arm }
          - { image: video, arch: amd64, os: ubuntu-latest }
          - { image: video, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fafnirx-${{ matrix.image }}:check
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Start it and check that it works
        run: bash .github/scripts/smoke-image.sh fafnirx-${{ matrix.image }}:check ${{ matrix.image }}

      # The bundle is built on the same stages as the images (the layers are in the cache by now), and has to run on the master
      # image of this platform: the program is built on its system.
      - name: Build the video plugin
        if: ${{ matrix.image == 'master' }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: plugin-video
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ inputs.version }}
          outputs: type=local,dest=plugin-out
          provenance: false
          cache-from: type=gha,scope=image-video-${{ matrix.arch }}
      - name: Start the master with the plugin and check that it works
        if: ${{ matrix.image == 'master' }}
        run: bash .github/scripts/smoke-image.sh fafnirx-master:check plugin plugin-out/fafnirx-plugin-video-*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.image == 'master' }}
        with:
          name: plugin-video-${{ matrix.arch }}
          path: plugin-out/*
          if-no-files-found: error

  push:
    if: ${{ inputs.push }}
    strategy:
      fail-fast: true
      matrix:
        image: [master, video]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ matrix.image == 'video' && (vars.DOCKERHUB_VIDEO_IMAGE || format('{0}/fafnirx-video', secrets.DOCKERHUB_USERNAME)) || (vars.DOCKERHUB_IMAGE || format('{0}/fafnirx', secrets.DOCKERHUB_USERNAME)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      # Every layer comes from the cache the check filled (one scope per platform), so nothing is compiled twice. If the
      # cache was evicted in between, the build is just slower (the other platform runs under emulation).
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=image-${{ matrix.image }}-amd64
            type=gha,scope=image-${{ matrix.image }}-arm64

      - name: What was pushed
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
