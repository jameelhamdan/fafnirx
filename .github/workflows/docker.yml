# The master image (see Dockerfile) for linux/amd64 and linux/arm64. Called twice by the Release workflow:
#   push: false  builds each platform on a runner of its own kind (no emulation), starts the image against a PostgreSQL
#                and checks that it works (.github/scripts/smoke-image.sh). Nothing leaves the runner.
#   push: true   builds both platforms again, from the layers the check cached, and pushes <version>, <major>.<minor> and
#                latest to Docker Hub.
# So the image is proven on both platforms before anything is pushed anywhere.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write rights), and optionally the
# repository variable DOCKERHUB_IMAGE (default <username>/fafnirx-master).
name: Docker

on:
  workflow_call:
    inputs:
      version:
        description: The version being released, X.Y.Z
        type: string
        required: true
      push:
        description: Push to Docker Hub (otherwise only build and check)
        type: boolean
        default: false
      ref:
        description: The commit to build (the Release workflow passes the commit it is releasing); default is the one that started the run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.push }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fafnirx-master:check
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Start it and check that it works
        run: bash .github/scripts/smoke-image.sh fafnirx-master:check

  push:
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/fafnirx-master', secrets.DOCKERHUB_USERNAME) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      # Every layer comes from the cache the check filled (one scope per platform), so nothing is compiled twice. If the
      # cache was evicted in between, the build is just slower (the other platform runs under emulation).
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64

      - name: What was pushed
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
