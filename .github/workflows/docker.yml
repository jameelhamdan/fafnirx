# The images (docker/Dockerfile.master, and docker/Dockerfile.<module> for each module) for linux/amd64 and linux/arm64. Called twice by the Release
# workflow:
#   push: false  builds each image on each platform on a runner of its own kind (no emulation), starts it and checks that
#                it works (.github/scripts/smoke-image.sh). Nothing leaves the runner.
#   push: true   builds both platforms again, from the layers the check cached, and pushes <version>, <major>.<minor> and
#                latest to Docker Hub.
# So every image is proven on both platforms before anything is pushed anywhere. A new module is one more entry in the two
# matrices.
#
# The check also starts the master image with each module image connected to it (it announces itself, see docs/modules.md).
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with write rights), and optionally the
# repository variables DOCKERHUB_IMAGE (default <username>/fafnirx) and DOCKERHUB_VIDEO_IMAGE (default
# <username>/fafnirx-video) and DOCKERHUB_FETCH_IMAGE (default <username>/fafnirx-fetch).
name: Docker

on:
  workflow_call:
    inputs:
      version:
        description: The version being released, X.Y.Z
        type: string
        required: true
      push:
        description: Push to Docker Hub (otherwise only build and check)
        type: boolean
        default: false
      ref:
        description: The commit to build (the Release workflow passes the commit it is releasing); default is the one that started the run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.push }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: master, arch: amd64, os: ubuntu-latest }
          - { image: master, arch: arm64, os: ubuntu-24.04-arm }
          - { image: video, arch: amd64, os: ubuntu-latest }
          - { image: video, arch: arm64, os: ubuntu-24.04-arm }
          - { image: fetch, arch: amd64, os: ubuntu-latest }
          - { image: fetch, arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fafnirx-${{ matrix.image }}:check
          provenance: false
          cache-from: type=gha,scope=image-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Start it and check that it works
        run: bash .github/scripts/smoke-image.sh fafnirx-${{ matrix.image }}:check ${{ matrix.image }}

      # The module images are in the cache by now. Each one has to announce itself to the master and be reached by it.
      - name: Build the video image
        if: ${{ matrix.image == 'master' }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile.video
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fafnirx-video:check
          provenance: false
          cache-from: type=gha,scope=image-video-${{ matrix.arch }}
      - name: Connect the video module to the master and check that it works
        if: ${{ matrix.image == 'master' }}
        run: bash .github/scripts/smoke-image.sh fafnirx-master:check connect fafnirx-video:check video

      - name: Build the fetch image
        if: ${{ matrix.image == 'master' }}
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile.fetch
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: fafnirx-fetch:check
          provenance: false
          cache-from: type=gha,scope=image-fetch-${{ matrix.arch }}
      - name: Connect the fetch module to the master and check that it works
        if: ${{ matrix.image == 'master' }}
        run: bash .github/scripts/smoke-image.sh fafnirx-master:check connect fafnirx-fetch:check fetch

  push:
    if: ${{ inputs.push }}
    strategy:
      fail-fast: true
      matrix:
        image: [master, video, fetch]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ matrix.image == 'video' && (vars.DOCKERHUB_VIDEO_IMAGE || format('{0}/fafnirx-video', secrets.DOCKERHUB_USERNAME)) || matrix.image == 'fetch' && (vars.DOCKERHUB_FETCH_IMAGE || format('{0}/fafnirx-fetch', secrets.DOCKERHUB_USERNAME)) || (vars.DOCKERHUB_IMAGE || format('{0}/fafnirx', secrets.DOCKERHUB_USERNAME)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      # Every layer comes from the cache the check filled (one scope per platform), so nothing is compiled twice. If the
      # cache was evicted in between, the build is just slower (the other platform runs under emulation).
      - uses: docker/build-push-action@v6
        env:
          # Not needed, and the file it would upload as an artifact is not worth a place in the run's list.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: |
            type=gha,scope=image-${{ matrix.image }}-amd64
            type=gha,scope=image-${{ matrix.image }}-arm64

      - name: What was pushed
        run: docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}"
