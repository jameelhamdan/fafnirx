# Checks every push to master and every pull request: formatting, lints, Rust tests (with a real PostgreSQL) and the
# web app's types and lint. The Release workflow calls it too, so nothing is released that does not pass.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check (the Release workflow passes the commit it is releasing); default is the one that started the run
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      FAFNIRX_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build packages (tray icon, rclone for the mirror tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev rclone
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app (it is embedded in the master)
        run: cd frontend && npm ci && npm run build
      # The Release workflow commits the new version with this script. Doing it here too means that a new crate or a
      # change in Cargo's lockfile breaks CI today and not on the day of a release.
      - name: The version bump of the Release workflow works with this Cargo.lock
        run: |
          python3 .github/scripts/set_version.py 999.0.0
          cargo metadata --locked --format-version 1 > /dev/null
          git checkout -- Cargo.toml Cargo.lock
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npx tsc -b && npx oxlint
