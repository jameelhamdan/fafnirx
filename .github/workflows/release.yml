# The one way to release. Actions -> Release -> Run workflow, on master, with the new version (X.Y.Z, no "v").
#
#   1. validate   the version is X.Y.Z, newer than every release so far, not used before, and is the version Cargo.toml
#                 already has (bump it in a commit on master first: Cargo.toml and Cargo.lock)
#   2. checks     CI (fmt, clippy, tests, web app) on this commit; the client built for every platform; the Docker image
#                 built and started on amd64 and arm64
#   3. approve    the "release" environment (add required reviewers to it in the repository settings to ask for a
#                 click here). Reached only when EVERYTHING in step 2 passed. Nothing has been published up to this point.
#   4. publish    the image to Docker Hub (<version>, <major>.<minor>, latest), then the tag and the GitHub Release with
#                 the client files attached, then (if ticked) the Homebrew formula
#
# A run that fails before step 4 leaves nothing behind. If step 4 fails halfway, run it again with the same version: the
# tag is only created by its last step, and pushing the same image again changes nothing.
# "dry_run" stops after step 2: use it to try the pipeline without publishing anything.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (see docker.yml), HOMEBREW_TAP_TOKEN for Homebrew (see homebrew.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, X.Y.Z (already set in Cargo.toml on master)
        type: string
        required: true
      dry_run:
        description: Only validate and build, publish nothing
        type: boolean
        default: false
      homebrew:
        description: Also update the Homebrew formula
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags
      - name: Check the version
        id: v
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/master ] || fail "run this on master, not on $GITHUB_REF"
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "'$VERSION' is not a version of the form X.Y.Z (no leading v, no suffix)"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || gh release view "v$VERSION" >/dev/null 2>&1; then
            fail "v$VERSION is already released"
          fi
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            fail "$VERSION is not newer than the latest release, $latest"
          fi
          # Every crate of the workspace must already say this version: the binaries, the installers and the image are
          # built from the commit as it is (the builds use --locked, so Cargo.lock has to agree too).
          found=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u | paste -sd' ')
          [ "$found" = "$VERSION" ] || fail "Cargo.toml says '$found': set it to $VERSION in a commit on master first"
          echo "releasing $VERSION after ${latest:-nothing}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  image:
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false

  client:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64, deb: true }
          - { os: ubuntu-22.04-arm, name: linux-aarch64, deb: true }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux build packages (tray icon)
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build (Linux, macOS)
        if: ${{ !startsWith(matrix.name, 'windows') }}
        run: |
          cargo build --release --locked -p fafnirx
          test "$(target/release/fafnirx --version)" = "fafnirx $VERSION"
          mkdir out
          stage=fafnirx-$VERSION-${{ matrix.name }}
          mkdir "$stage"
          cp target/release/fafnirx installer/install.sh "$stage/"
          tar czf "out/$stage.tar.gz" "$stage"

      - name: Debian package
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p fafnirx --no-build --output out/

      # build.ps1 reads the version from Cargo.toml and stops if the binary reports a different one.
      - name: Windows installer
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          installer\build.ps1
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\fafnirx-setup-*.exe out\

      - name: Checksums
        run: cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Everything above has passed. Nothing has been published yet.
  approve:
    if: ${{ !inputs.dry_run }}
    needs: [ci, image, client]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "CI, the client for every platform and the image for both platforms all passed; publishing."

  publish-image:
    needs: [validate, approve]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: true
    secrets: inherit

  release:
    needs: [validate, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/fafnirx-master', secrets.DOCKERHUB_USERNAME) }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the tag and the release
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          printf 'Server: `docker pull %s:%s`\n\nClient: the installer for your system is attached below, each with a `.sha256`.\n\n' \
            "$IMAGE" "$VERSION" > notes.md
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file notes.md --generate-notes

  homebrew:
    if: ${{ inputs.homebrew }}
    needs: [validate, release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit
