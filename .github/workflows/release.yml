# The one way to release, and nothing has to be done by hand before it: Actions -> Release -> Run workflow, on master, with
# the new version (X.Y.Z, no "v"). The workflow makes the commit that sets that version in Cargo.toml and Cargo.lock.
#
#   1. validate   the version is X.Y.Z, newer than every release so far, not used before, and not below Cargo.toml's;
#                 the secrets of the publishing steps are set and Docker Hub accepts the login (so that a missing one is
#                 found now and not after master has been changed)
#   2. prepare    the commit "Release X.Y.Z" (made from the commit the run started on) is pushed to the temporary branch
#                 release/X.Y.Z, and from here on EVERY job builds and tests that exact commit. If Cargo.toml already
#                 says X.Y.Z (the first release of a version, a rerun) there is nothing to commit and the run's own
#                 commit is used.
#   3. checks     CI (fmt, clippy, tests, web app); the client built for every platform; the Docker image built and
#                 started on amd64 and arm64
#   4. approve    the "release" environment (add required reviewers to it in the repository settings to ask for a
#                 click here). Reached only when EVERYTHING in step 3 passed. Nothing has been published up to this point,
#                 and master has not been touched.
#   5. publish    the release commit becomes the new head of master (a fast-forward: it is refused if master has moved on
#                 meanwhile, and then nothing else is published: run it again), the image goes to Docker Hub (<version>,
#                 <major>.<minor>, latest), then the tag and the GitHub Release with the client files, then (if ticked)
#                 the Homebrew formula
#   6. cleanup    the temporary branch is deleted, whatever happened
#
# A run that fails before step 5 leaves nothing behind. If step 5 fails halfway, run it again with the same version:
# the version commit is on master by then, so the rerun has nothing to commit and releases master as it is.
# "dry_run" stops after step 3: use it to try the pipeline without publishing anything.
#
# Needs: secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (see docker.yml), HOMEBREW_TAP_TOKEN for Homebrew (see homebrew.yml).
# If master is protected, the github-actions bot must be allowed to push to it, or the commit of step 5 is refused.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New version, X.Y.Z (the workflow commits it to Cargo.toml and Cargo.lock)
        type: string
        required: true
      dry_run:
        description: Only validate and build, publish nothing
        type: boolean
        default: false
      homebrew:
        description: Also update the Homebrew formula
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags
      - name: Check the version
        id: v
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/master ] || fail "run this on master, not on $GITHUB_REF"
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "'$VERSION' is not a version of the form X.Y.Z (no leading v, no suffix)"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || gh release view "v$VERSION" >/dev/null 2>&1; then
            fail "v$VERSION is already released"
          fi
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            fail "$VERSION is not newer than the latest release, $latest"
          fi
          # The workflow sets the version itself, but never lowers it: a Cargo.toml that is ahead of the version asked for
          # is a mistake in one of the two.
          current=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)
          [[ $current =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "cannot read the version in Cargo.toml (got '$current')"
          if [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
            fail "Cargo.toml says $current, which is newer than $VERSION"
          fi
          echo "releasing $VERSION (Cargo.toml says $current, the last release is ${latest:-nothing})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Found out now, before anything is changed, and not at the last step after the version commit is on master.
      - name: Check that the secrets of the publishing steps are set
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WITH_HOMEBREW: ${{ inputs.homebrew }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ "$WITH_HOMEBREW" = true ] && [ -z "$HOMEBREW_TAP_TOKEN" ]; then missing="$missing HOMEBREW_TAP_TOKEN"; fi
          if [ -n "$missing" ]; then
            echo "::error::These secrets are not set:$missing. Add each as a REPOSITORY secret with exactly this name (Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret). Secrets of an environment, of Dependabot, and variables are not seen by the publishing jobs. Nothing was changed."
            exit 1
          fi
      - name: Check that Docker Hub accepts the login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  prepare:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.p.outputs.sha }}
      bumped: ${{ steps.p.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so that the push of the version commit can be checked against what is there
      - name: Make the version commit
        id: p
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash .github/scripts/prepare-release.sh "$VERSION"

  ci:
    needs: [validate, prepare]
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  image:
    needs: [validate, prepare]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: false
      ref: ${{ needs.prepare.outputs.sha }}

  client:
    needs: [validate, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64, deb: true }
          - { os: ubuntu-22.04-arm, name: linux-aarch64, deb: true }
          - { os: macos-15-intel, name: macos-x86_64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Linux build packages (tray icon)
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Build (Linux, macOS)
        if: ${{ !startsWith(matrix.name, 'windows') }}
        run: |
          cargo build --release --locked -p fafnirx
          test "$(target/release/fafnirx --version)" = "fafnirx $VERSION"
          mkdir out
          stage=fafnirx-$VERSION-${{ matrix.name }}
          mkdir "$stage"
          cp target/release/fafnirx installer/install.sh "$stage/"
          tar czf "out/$stage.tar.gz" "$stage"

      - name: Debian package
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p fafnirx --no-build --output out/

      # build.ps1 reads the version from Cargo.toml and stops if the binary reports a different one.
      - name: Windows installer
        if: startsWith(matrix.name, 'windows')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          installer\build.ps1
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\fafnirx-setup-*.exe out\

      - name: Checksums
        run: cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Everything above has passed. Nothing has been published yet, and master has not been touched.
  approve:
    if: ${{ !inputs.dry_run }}
    needs: [ci, image, client]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "CI, the client for every platform and the image for both platforms all passed; publishing."

  # The version commit becomes the head of master. First of the publishing steps because it is the one that can be refused
  # (master moved on while the checks ran), and then nothing else has been published.
  land:
    needs: [prepare, approve]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          # Not a shallow checkout: git can only push a fast-forward when it has the commit master is at now, which is
          # the version commit's parent.
          fetch-depth: 0
      - name: Fast-forward master to the release commit
        if: needs.prepare.outputs.bumped == 'true'
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git push origin "$SHA:refs/heads/master" || {
            echo "::error::master has moved on since this release started, so the version commit cannot be added to it. Nothing was published: run the Release workflow again."
            exit 1
          }

  publish-image:
    needs: [validate, prepare, land]
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      push: true
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  release:
    needs: [validate, prepare, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/fafnirx-master', secrets.DOCKERHUB_USERNAME) }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the client files: a run also holds other artifacts (the build records that docker/build-push-action uploads),
      # and downloading those too failed the release.
      - uses: actions/download-artifact@v4
        with:
          pattern: client-*
          path: out
          merge-multiple: true
      - name: Create the tag and the release
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          printf 'Server: `docker pull %s:%s`\n\nClient: the installer for your system is attached below, each with a `.sha256`.\n\n' \
            "$IMAGE" "$VERSION" > notes.md
          gh release create "v$VERSION" out/* --target "$SHA" --title "v$VERSION" \
            --notes-file notes.md --generate-notes

  homebrew:
    if: ${{ inputs.homebrew }}
    needs: [validate, release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.validate.outputs.version }}
    secrets: inherit

  # The temporary branch is not needed any more, or never will be (a failed run, a dry run).
  cleanup:
    if: ${{ always() && needs.prepare.outputs.bumped == 'true' }}
    needs: [validate, prepare, ci, image, client, approve, land, publish-image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release/${{ needs.validate.outputs.version }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" || true
